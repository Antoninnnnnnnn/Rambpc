[package]
name = "rambler-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "rambler"
path = "src/main.rs"

[[example]]
name = "session_reuse"
required-features = ["audio"]

[features]
default = []
audio = ["dep:rambler-audio"]

[dependencies]
rambler-audio = { path = "../rambler-audio", optional = true }
rambler-engine = { path = "../rambler-engine" }
rambler-transport = { path = "../rambler-transport" }
bytes.workspace = true
tokio.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
serde.workspace = true
sha2.workspace = true
rambler-protocol = { path = "../rambler-protocol" }
http.workspace = true
futures-util.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
hex.workspace = true
tempfile = "3"
ogg = "0.9"
opus = "=0.4.0"
