name: offline-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    env:
      PYTHONASYNCIODEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tested dependency versions
        run: python -m pip install -c constraints-tested.txt -e '.[test]'
      - name: Install optional native audio on current Python
        if: matrix.python == '3.14'
        run: python -m pip install -c constraints-tested.txt -e '.[audio]'
      - name: Run offline tests only
        run: python -m pytest -q -W error -o faulthandler_timeout=30
      - name: Exercise CLI help
        run: python -m rambler.cli --help
      - name: Build wheel
        run: python -m pip wheel --no-deps . -w dist
