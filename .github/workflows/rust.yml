name: rust-offline-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Explicit standard x64 runner; macos-latest currently exercises ARM64.
        # Scope and image references: docs/research/rust-macos-intel-validation.md
        os: [ubuntu-latest, windows-latest, macos-latest, macos-26-intel]
        toolchain: ['1.88.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check native tools
        run: |
          cmake --version
          rustc --version
          cargo --version
      - name: Test audio dependency boundary checker
        run: python -m unittest discover -s tests -p test_rust_audio_boundary.py -v
      - name: Test native public-root smoke checker
        run: python -m unittest discover -s tests -p test_rust_native_roots.py -v
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check production audio dependency boundary offline
        run: python tools/check_rust_audio_boundary.py
      - name: Test workspace with audio offline
        run: cargo test --workspace --all-features --locked --offline
      - name: Smoke native public-root TLS configuration offline
        timeout-minutes: 3
        run: python -I tools/check_rust_native_roots.py
      - name: Test CLI session reuse example offline
        run: cargo test -p rambler-cli --features audio --example session_reuse --locked --offline
      - name: Test synthetic audio profiling invariants offline
        run: cargo test -p rambler-audio --example profile_pipeline --locked --offline
      - name: Test guarded SDK loopback example offline
        run: cargo test -p rambler-cli --features audio --example linux_guarded_loopback --locked --offline
      - name: Test real admission example with pure fakes offline
        run: cargo test -p rambler-cli --features audio --example linux_real_admission --locked --offline
      - name: Test bounded wire profiling invariants offline
        run: cargo test -p rambler-protocol --example profile_wire_encoding --locked --offline
      - name: Test static gRPC prefix profiling invariants offline
        run: cargo test -p rambler-transport --example profile_grpc_prefix --locked --offline
      - name: Build release CLI with audio offline
        run: cargo build -p rambler-cli --bin rambler --features audio --release --locked --offline
      - name: Test native qualification report parser
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: python -I -B -m unittest discover -s tests -p test_compare_native_qualification.py
      - name: Qualify native audio on owned localhost offline
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        timeout-minutes: 5
        shell: bash
        run: |
          cargo build -p rambler-cli --features audio --example native_qualification --release --locked --offline
          report="$(mktemp "$RUNNER_TEMP/native-qualification.XXXXXX")"
          errors="$(mktemp "$RUNNER_TEMP/native-qualification-errors.XXXXXX")"
          trap 'rm -f "$report" "$errors"' EXIT
          if ! target/release/examples/native_qualification --repeats 1 > "$report" 2> "$errors"; then
            echo 'Native qualification did not complete successfully.' >&2
            exit 1
          fi
          python -I -B -c 'import sys; sys.path.insert(0, "tools"); from compare_native_qualification import read_report; report = read_report(sys.argv[1]); sys.exit(0 if report["repeats"] == 1 else 1)' "$report"
      - name: Test release CLI finalization timeout on loopback offline
        env:
          RAMBLER_TEST_CLI_EXECUTABLE: ${{ github.workspace }}/target/release/rambler${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cargo test -p rambler-cli --features audio --test finalization_cli --locked --offline -- s3_end_without_grpc_trailers_exits_with_finalize_timeout --exact
      - name: Test release CLI budget rejection before I/O offline
        env:
          RAMBLER_TEST_CLI_EXECUTABLE: ${{ github.workspace }}/target/release/rambler${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cargo test -p rambler-cli --features audio --test invalid_budgets --locked --offline
      - name: Run release synthetic PCM channel example offline
        run: cargo run -p rambler-audio --example pcm_channel --release --locked --offline
      - name: Test CLI without audio offline
        run: cargo test -p rambler-cli --no-default-features --locked --offline

  vs17-opus:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Test VS17 qualification validators on synthetic data
        run: python -I tools/opus_vs_ci_selftest.py
      - name: Fetch locked dependencies
        run: cargo +stable fetch --locked
      - name: Isolate and verify the functional VS17 Release branch
        timeout-minutes: 13
        run: python -I tools/qualify_opus_vs_ci.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo fetch --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
